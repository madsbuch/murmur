[package]
name = "murmur"
version = "0.3.0"
description = "Offline notes and files shared directly between nearby devices."
edition = "2021"
rust-version = "1.90"

[workspace]
members = ["plugins/lan"]
resolver = "2"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-lan = { path = "plugins/lan" }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
automerge = "0.12"
chacha20poly1305 = "0.11"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rand = "0.9"
socket2 = "0.6"
diesel = { version = "=2.4.0", default-features = false, features = ["sqlite", "std"] }
diesel_migrations = { version = "=2.4.0", features = ["sqlite"] }
libsqlite3-sys = { version = "=0.40.0", features = ["bundled"] }
sha2 = "0.11"
bip39 = { version = "=3.0.0", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.12.5", features = ["image-png"] }
tauri-plugin-clipboard-manager = "=2.5.0"
png = "=0.18.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
as_conversions = "forbid"
