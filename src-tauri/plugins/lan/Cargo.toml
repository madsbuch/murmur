[package]
name = "tauri-plugin-lan"
version = "0.1.0"
description = "Murmur LAN discovery using Android NSD, Apple Bonjour, and desktop mDNS"
edition = "2021"
links = "tauri-plugin-lan"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mdns-sd = { version = "0.21.7", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }
